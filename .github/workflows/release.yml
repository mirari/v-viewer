name: Release
on:
  push:
    tags: ['vue2-v*', 'vue3-v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:docs
      - name: Upload browser test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-release
          path: |
            playwright-report/docs/
            test-results/docs/
          if-no-files-found: ignore
          retention-days: 14
      - id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-info.mjs "$RELEASE_TAG"
      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$RELEASE_TAG" artifacts/notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            artifacts/v-viewer-${{ steps.release.outputs.version }}.tgz
            artifacts/notes.md
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: artifacts
      - name: Publish verified package with npm trusted publishing
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: npm publish "./artifacts/v-viewer-$VERSION.tgz" --tag "$CHANNEL" --access public --provenance
  release:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          args=(--verify-tag --title "$RELEASE_TAG" --notes-file artifacts/notes.md --latest=false)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "artifacts/v-viewer-$VERSION.tgz" "${args[@]}"
